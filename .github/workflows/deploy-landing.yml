name: Deploy Landing Page
on:
  push:
    branches: [main]
    paths: ['docs/**', 'profiles/*/profile.yaml']
  # Re-deploy the full Jekyll site after discover-publish overwrites Pages
  # with its docs/discovered-only artifact.
  workflow_run:
    workflows: ["Discover & Publish Skills"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # On a workflow_run trigger, only deploy if discover-publish succeeded;
    # always run for direct pushes (where github.event.workflow_run is null).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v4.0.0

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb9fb82d32c6a1dfac # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
