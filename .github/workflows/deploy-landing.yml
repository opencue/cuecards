name: Deploy Landing Page
on:
  push:
    branches: [main]
    paths: ['docs/**', 'profiles/*/profile.yaml']
  # Re-deploy the full Jekyll site after discover-publish overwrites Pages
  # with its docs/discovered-only artifact.
  workflow_run:
    workflows: ["Discover & Publish Skills"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # On a workflow_run trigger, only deploy if discover-publish succeeded;
    # always run for direct pushes (where github.event.workflow_run is null).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
