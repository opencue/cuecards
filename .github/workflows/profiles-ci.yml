name: Profiles CI

on:
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "profiles/**"
      - "docs/profiles/**"
      - "test/e2e/**"
      # Submodule gitlink bumps change which skills/MCPs resolve — test them.
      - "resources/skills"
      - "resources/mcps"
      - "README.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/profiles-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "bin/**"
      - "src/**"
      - "profiles/**"
      - "docs/profiles/**"
      - "test/e2e/**"
      # Submodule gitlink bumps change which skills/MCPs resolve — test them.
      - "resources/skills"
      - "resources/mcps"
      - "README.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/profiles-ci.yml"

permissions:
  contents: read

jobs:
  e2e:
    name: Profiles e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Cache Bun and npx profile artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            profiles/_cache/bun
            profiles/_cache/npx
          key: ${{ runner.os }}-profiles-${{ hashFiles('bun.lock', 'profiles/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-profiles-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run profile smoke tests
        run: bash test/e2e/run.sh
