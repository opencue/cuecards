name: Workspace isolation
on:
  pull_request:
    paths: ["web/**", ".github/workflows/workspaces.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/workspaces.yml"]
permissions:
  contents: read
jobs:
  workspace-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad8a91a0c59e6b73cf74b46e58c5da4b35 # v2.0.1
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: bun test web/lib/workspaces.test.ts web/lib/workspace-http.test.ts web/lib/gx.test.ts web/vercel-routing.test.ts
        env:
          WORKSPACES_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      - run: web/node_modules/.bin/tsc --noEmit --strict --skipLibCheck --moduleResolution bundler --module esnext --target es2022 web/lib/workspaces.ts web/lib/workspace-http.ts web/lib/gx.ts web/api/v1/workspaces.ts web/api/gx-hook.ts
      - name: Verify real auth migration and two-user HTTP flow
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          BETTER_AUTH_URL: http://localhost:3000
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          (cd web && npm run auth:migrate && npm run workspaces:migrate)
          bun web/scripts/dev-server.ts > /tmp/cuecards-auth.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/auth/ok >/dev/null; then break; fi
            sleep 1
          done
          bun web/scripts/check-workspaces-flow.ts
