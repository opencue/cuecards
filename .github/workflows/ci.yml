name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test --timeout 30000


      - name: DIAG hook scoring
        run: |
          set +e
          REPO="$PWD"
          export CUE_SMART_LOOKUP="$REPO/resources/skills/skills/meta/smart-loader/scripts/smart-lookup.sh"
          export CUE_CATALOG="$REPO/resources/skills/catalog/catalog.json"
          export CUE_SKILLS_ROOT="$REPO/resources/skills/skills"
          export CUE_SKILL_INDEX_DIR="$HOME/.cache/cue/skill-index"
          echo "--- bun: $(bun --version)  awk: $(awk --version 2>&1|head -1)  locale: ${LANG:-unset}/${LC_ALL:-unset}"
          echo "--- building index the way beforeAll does"
          bun -e 'import{buildIndex,writeMatcherIndex,matcherDir}from"./src/lib/catalog-index";const i=buildIndex({catalog:process.env.CUE_CATALOG,root:process.env.CUE_SKILLS_ROOT});console.log("skills in index:",Object.keys(i.skills??{}).length||JSON.stringify(Object.keys(i)).slice(0,200));console.log("matcherDir:",matcherDir());console.log(JSON.stringify(writeMatcherIndex(i)));'
          echo "--- index files"; ls -l "$CUE_SKILL_INDEX_DIR"; cat "$CUE_SKILL_INDEX_DIR/weights.env"
          echo "--- grep the index for the terms these two prompts need"
          for t in checkout webhook fizetes; do echo "term[$t]: $(grep -P "^$t\\t" "$CUE_SKILL_INDEX_DIR/terms.idx" | head -5 | tr '\n' ' | ')"; done
          echo "phrase[kozbeszerzes]: $(grep -i 'zbeszerz' "$CUE_SKILL_INDEX_DIR/phrases.idx" | head -5 | tr '\n' ' | ')"
          echo "--- run the hook on the two failing prompts"
          for p in "a fizetes nem megy az adminban, checkout es webhook hibas" "közbeszerzés pályázat keresés"; do
            echo "=== prompt: $p"
            printf '{"prompt":"%s","session_id":"diag-%s","cwd":"/tmp"}' "$p" "$RANDOM" \
              | HOME=$(mktemp -d) CUE_ACTIVE_PROFILE="" CLAUDE_CONFIG_DIR="" \
                CUE_SMART_LOOKUP="$CUE_SMART_LOOKUP" CUE_CATALOG="$CUE_CATALOG" \
                CUE_SKILLS_ROOT="$CUE_SKILLS_ROOT" CUE_SKILL_INDEX_DIR="$CUE_SKILL_INDEX_DIR" \
                bash -x resources/hooks/smart-loader-suggest.sh 2>&1 | grep -E "scored=|rows=|query_words=|indexed_terms|\+ exit|Available skills|^\s+- " | head -20
          done
      - name: Verify CLI boots
        run: bun src/index.ts --version

      - name: Smoke-test install.sh into a throwaway prefix
        shell: bash
        run: |
          PREFIX="$(mktemp -d)"
          # Stub authmux so install.sh's Step 5 doesn't run `npm install -g`.
          printf '#!/usr/bin/env bash\necho 0.0.0\n' > "$PREFIX/authmux"
          chmod +x "$PREFIX/authmux"
          # CUE_SHIMS is where the agent shims land; without it they go to
          # ~/.config/cue/shims and the assertions below test an empty prefix.
          SHIM_DIR="$PREFIX" CUE_SHIMS="$PREFIX" CUE_DIR="$GITHUB_WORKSPACE" PATH="$PREFIX:$PATH" bash ./install.sh --yes
          test -L "$PREFIX/cue" -o -f "$PREFIX/cue"
          grep -Eq 'exec .*bin/cue" launch claude' "$PREFIX/claude"
          PATH="$PREFIX:$PATH" "$PREFIX/cue" --version

      - name: Verify bundled CLI boots
        run: bun run build:bundle && node dist/cue.js --version

      - name: Validate all profiles
        run: bun src/index.ts validate --all || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun x tsc --noEmit --skipLibCheck

      - name: Lint (biome)
        run: bun run lint

      # Advisory until the skill-hygiene backlog (duplicate slugs etc.) is
      # cleared; `skills lint --all` currently reports 174 errors the
      # materializer tolerates via last-wins. Fixed the command (was a silent
      # no-op: bare `skills-lint` exits 1 on usage, masked by `|| true`).
      - name: Lint skills
        run: bun src/index.ts skills lint --all || true
