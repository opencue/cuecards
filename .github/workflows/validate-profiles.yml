name: Validate Profiles

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'profiles/**'
      - 'resources/skills/**'
      - 'resources/mcps/**'
      - 'resources/skill-packs/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - uses: oven-sh/setup-bun@4bc047ad8a91a0c59e6b73cf74b46e58c5da4b35 # v2.0.1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate all profiles
        run: bin/cue validate --all

      - name: Run doctor checks
        run: bin/cue doctor

      - name: Lint all skills
        run: bin/cue skills lint --all

      - name: Run skill tests
        run: bin/cue skills test --all
