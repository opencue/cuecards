name: Validate Profiles

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'profiles/**'
      - 'resources/skills/**'
      - 'resources/mcps/**'
      - 'resources/skill-packs/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate all profiles
        run: bin/cue validate --all

      - name: Run doctor checks
        run: bin/cue doctor

      - name: Lint all skills
        run: bin/cue skills lint --all

      - name: Run skill tests
        run: bin/cue skills test --all
