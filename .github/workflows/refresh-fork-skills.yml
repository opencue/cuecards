name: Check fork skill updates
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-fork-skills
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Compare catalog pins to source trees
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bun scripts/refresh-fork-skills.ts --write > "$RUNNER_TEMP/fork-skills.md"; then
            echo 'Skill refresh failed. See the compare step log for details; no update PR was created.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$RUNNER_TEMP/fork-skills.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the candidate catalog and profile
        run: |
          bun install --frozen-lockfile
          bun test scripts/refresh-fork-skills.test.ts src/commands/fork-skills.test.ts
          git diff --check
      - name: Propose changed pins for review
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SKILLS_PR_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          files=(web/src/skill-catalog.json web/src/fork-skill-listings.json profiles/nagyvikt-skills/profile.yaml)
          if git diff --quiet -- "${files[@]}"; then exit 0; fi
          if [ -z "$GH_TOKEN" ]; then
            {
              echo 'No scoped PR token configured. Review the sources and apply the proposed pins manually:'
              echo '~~~diff'
              git diff -- "${files[@]}"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          open="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "base=$BASE_BRANCH" -F per_page=100 \
            | jq 'any(.[][]; .head.ref | startswith("automation/fork-skill-refresh-"))')"
          if [ "$open" = true ]; then
            echo 'A fork skill update PR is already open.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/fork-skill-refresh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git add -- "${files[@]}"
          git -c user.name=cue-bot -c user.email=cue-bot@users.noreply.github.com \
            commit -m 'chore(skills): refresh reviewed fork candidates'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" --title 'chore(skills): review fork skill updates' \
            --body-file "$RUNNER_TEMP/fork-skills.md" >> "$GITHUB_STEP_SUMMARY"
