name: jetson
icon: "🟩"
description: NVIDIA Jetson edge AI devices — JetPack, L4T, Tegra, Orin/Thor, CUDA/TensorRT, LLM/VLM serving, NVENC/NVDEC video, diagnostics, memory, and benchmarking
inherits: core
skills:
  local: []
  npx:
    # NVIDIA's device-side Agent Skills, pinned for reproducible Codex launches.
    - repo: NVIDIA-AI-IOT/jetson-device-skills
      pin: git@20137897aef549cc2fa36a18c10e45da94967c3e
      skills:
        - jetson-diagnostic
        - jetson-headless-mode
        - jetson-inference-mem-tune
        - jetson-llm-benchmark
        - jetson-llm-serve
        - jetson-memory-audit
        - jetson-package
        - jetson-print-device-info
        - jetson-speculative-decoding
