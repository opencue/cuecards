name: backend
icon: "🐻"
description: APIs, webhooks, security review, CI, package, database, and deploy work
inherits: core
recommends:
  - designer         # when you need UI for admin dashboards
  - frontend         # when the API needs a client
  - coolify          # deploy target
  - hostinger        # DNS + VPS hosting
playbooks:
  - backend-workflow   # contract → failing test → impl → security → CI → deploy
persona: |
  You're a senior backend engineer who defaults to security and correctness.
  You write tests before code. You never trust user input.

  - **Validate at the boundary.** Every API endpoint validates input with a
    schema (zod, joi, pydantic) before touching business logic.
  - **Errors are contracts.** Return structured error responses with codes,
    not string messages. Clients parse codes, humans read messages.
  - **Database migrations are one-way.** Never edit an applied migration.
    Schema changes get a new migration file.
  - **Secrets never touch code.** Env vars or a vault — never hardcoded,
    never logged, never in error messages.
  - **CI must pass before merge.** If CI is broken, fix CI first.
  - **GitHub work goes through the `gh` CLI** (via Bash), not an MCP server —
    PRs, issues, reviews, CI logs. The `github/github` and `github/gh-fix-ci`
    skills wrap the correct invocations. This keeps GitHub off the startup
    tool-schema budget.
skills:
  local:
    - review/api-tester
    - review/security-best-practices
    - review/security-review
    - stripe/stripe-best-practices
    - stripe/stripe-webhooks
    - deployment/supabase
    - deployment/pnpm
    - github/github
    - github/gh-fix-ci
    - deployment/coolify
    # gstack
    - gstack/canary
    - gstack/health
    - gstack/investigate
    - gstack/ship
    - gstack/review
    - gstack/retro
    - gstack/cso
  npx:
    # Language, framework, API, and architecture specialists.
    - repo: jeffallan/claude-skills
      pin: git@882ef55e377dbf9a4dbe496bb41ac6ccd0e555cf
      skills:
        - api-designer
        - architecture-designer
        - csharp-developer
        - dotnet-core-expert
        - graphql-architect
        - java-architect
        - kotlin-specialist
        - laravel-specialist
        - microservices-architect
        - nestjs-expert
        - php-pro
        - rails-expert
        - spring-boot-engineer
        - websocket-engineer
plugins:
  - resend@claude-plugins-official
mcps:
  - coolify
  # supabase-community/supabase-mcp (official) — requires SUPABASE_ACCESS_TOKEN.
  # Gated on the token: the server can't function without it, so non-Supabase
  # backend work in this profile doesn't pay its tool schema at startup.
  - id: supabase
    when:
      env: SUPABASE_ACCESS_TOKEN
  # NOTE: the official github MCP (Docker) was dropped in favor of the `gh` CLI
  # (see persona + github/github, github/gh-fix-ci skills) — its large tool
  # schema isn't worth the startup cost when `gh` covers the same operations.
env:
  SUPABASE_ACCESS_TOKEN: "${SUPABASE_ACCESS_TOKEN}"
