name: gui-gitnexus
kind: overlay
icon: "◈"
description: Codex-only GitNexus MCP overlay for the KFB Wireless Clip Tester GUI repository
agents:
  - codex
inherits: core
codex_config:
  mcp_servers.gitnexus:
    command: pnpm
    args:
      - dlx
      - gitnexus@1.6.10
      - mcp
    startup_timeout_sec: 60
